name: AB AgentX Build #43
on:
  push:
    branches: [main]
    paths:
      - "android/AB-AgentX43/**"
      - ".github/workflows/ab-agentx-43.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AB-AgentX43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Build #43
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AB-AgentX-Build-43-APK
          path: android/AB-AgentX43/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
