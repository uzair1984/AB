name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android/AB-AgentX/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/AB-AgentX/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AB-AgentX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
