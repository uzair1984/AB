name: AB AgentX Build #45

on:
  pull_request:
    branches: [main]
    paths:
      - "android/AB-AgentX/**"
      - ".github/workflows/ab-agentx-44.yml"
  push:
    branches: [main]
    paths:
      - "android/AB-AgentX/**"
      - ".github/workflows/ab-agentx-44.yml"
  workflow_dispatch:

concurrency:
  group: ab-agentx-build-45
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AB-AgentX
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate required AB AgentX UI and control source
        run: |
          test -f app/src/main/java/com/ab/agentx/MainActivity.kt
          test -f app/src/main/res/drawable/ab_agentx_icon.xml
          grep -q 'Normal Mode' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'Active Mode' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'AB Off' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'Enable AB as Phone App' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'verticalScroll' app/src/main/java/com/ab/agentx/MainActivity.kt
      - name: Build and validate Build #45
        run: gradle assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Build #44 APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-AgentX-Build-45-APK
          path: android/AB-AgentX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
