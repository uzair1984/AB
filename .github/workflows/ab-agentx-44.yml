name: AB AgentX Build #46

on:
  push:
    branches: [main]
    paths:
      - "android/AB-AgentX/**"
      - ".github/workflows/ab-agentx-44.yml"
  workflow_dispatch:

concurrency:
  group: ab-agentx-build-46
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AB-AgentX
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate required AB AgentX UI and control source
        run: |
          test -f app/src/main/java/com/ab/agentx/MainActivity.kt
          test -s app/src/main/res/raw/ab_agentx_icon.webp.b64
          grep -q 'Normal Mode' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'Active Mode' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'AB Off' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'Enable AB as Phone App' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'verticalScroll' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'AB_GREETING_START' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'routeCallToSpeaker' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'TextToSpeech' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'greetedCalls' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'AB_VOICE_PIPELINE cellular_tts_local_only=true raw_cellular_pcm=false' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'Preview Selected Voice' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q 'VoiceSettingsStore.setVoice' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q '!femaleLabel' app/src/main/java/com/ab/agentx/MainActivity.kt
          grep -q '!femaleLabel' app/src/main/java/com/ab/agentx/call/ABInCallService.kt
          grep -q 'ABVoipTelecom.register(this)' app/src/main/java/com/ab/agentx/MainActivity.kt
          test -s app/src/main/java/com/ab/agentx/call/ABVoipConnectionService.kt
          grep -q 'media_transport_not_implemented' app/src/main/java/com/ab/agentx/call/ABVoipConnectionService.kt
          ! grep -q 'setActive()' app/src/main/java/com/ab/agentx/call/ABVoipConnectionService.kt
      - name: Materialize the requested AB AgentX icon
        run: |
          rm -f app/src/main/res/drawable/ab_agentx_icon.xml
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/res/raw/ab_agentx_icon.webp.b64 > app/src/main/res/drawable-nodpi/ab_agentx_icon.webp
          rm -f app/src/main/res/raw/ab_agentx_icon.webp.b64
          file app/src/main/res/drawable-nodpi/ab_agentx_icon.webp
      - name: Build and validate Build #46
        run: gradle assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Build #46 APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-AgentX-Build-46-APK
          path: android/AB-AgentX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
