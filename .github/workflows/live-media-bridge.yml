name: AB AgentX Live Media Bridge
on:
  push:
    branches:
      - feat/agentx-live-media-bridge
    paths:
      - 'services/live-media-bridge/**'
      - '.github/workflows/live-media-bridge.yml'
  pull_request:
    paths:
      - 'services/live-media-bridge/**'
      - '.github/workflows/live-media-bridge.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/live-media-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/live-media-bridge/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install
      - run: npm test
